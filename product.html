<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HOMIES — Producto</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="logo">HOMIES</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="coleccion.html">Collection</a>
  </nav>
</header>

<main class="product-page">

  <div class="product-gallery">
    <button class="gallery-arrow left">‹</button>
    <img id="product-image">
    <button class="gallery-arrow right">›</button>
  </div>

  <div class="product-details">
    <h1 id="product-name"></h1>
    <span class="price" id="product-price"></span>

    <div class="options">
      <p>Tallas</p>
      <div class="sizes">
        <button>S</button><button>M</button><button>L</button>
      </div>
    </div>

    <button class="buy-btn">Agregar al carrito</button>
  </div>

</main>

<script src="js/products.js"></script>
<script src="js/product.js"></script>

</body>
</html>
